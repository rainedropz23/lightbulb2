<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tutorials</title>
    <link rel="stylesheet" href="css/callingcard.css">
</head>
<body>

    <div class="snowfall" aria-hidden="true"></div>

    <nav class="back-nav">
        <a class="back-btn" href="portfolio.html"><span class="arrow">&larr;</span> Back to Portfolio</a>
    </nav>

    <h1 id="top">RAINE'S CALLING CARD</h1>

    <section>
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="images/raine 1x1.jpg" alt="Avatar">
                </div>
                <div class="flip-card-back">
                    <h2>Raine Gerald D. Mariano</h2>
                    <h3>STUDENT</h3>
                    <p>School: Olivarez College</p>
                    <p>BS Information Technology 2 - Binary</p>
                    <p>Cell No: 09760945663</p>
                    <p>Email: rainesocials23@gmail.com</p>
                    <p>Address: Sto. Nino, Paranaque City</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        
        var SPEED = 25;   
        var DELAY = 300;  

        var card = document.querySelector(".flip-card");
        var lines = document.querySelectorAll(
            ".flip-card-back h2, .flip-card-back h3, .flip-card-back p"
        );
        var chars = [];

       
        lines.forEach(function (line) {
            var text = line.textContent.trim();
            line.textContent = "";
            for (var i = 0; i < text.length; i++) {
                var span = document.createElement("span");
                span.className = "tw-char";
                span.textContent = text[i];
                line.appendChild(span);
                chars.push(span);
            }
        });

        var delayTimer = null;
        var typeTimer = null;
        var index = 0;
        var last = null;

        function resetTyping() {
            clearTimeout(delayTimer);
            clearInterval(typeTimer);
            chars.forEach(function (c) {
                c.classList.remove("show", "cursor");
            });
            index = 0;
            last = null;
        }

        function startTyping() {
            resetTyping();
            delayTimer = setTimeout(function () {
                typeTimer = setInterval(function () {
                    if (last) last.classList.remove("cursor");
                    var c = chars[index];
                    c.classList.add("show", "cursor");
                    last = c;
                    index++;
                    if (index >= chars.length) clearInterval(typeTimer);
                }, SPEED);
            }, DELAY);
        }

        
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            chars.forEach(function (c) { c.classList.add("show"); });
        } else {
            card.addEventListener("mouseenter", startTyping);
            card.addEventListener("mouseleave", resetTyping);
        }
    </script>

</body>
<footer>
    <a href="#top">GO TO TOP</a>
</footer>
</html>
