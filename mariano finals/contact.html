<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tutorials</title>
    <link rel="stylesheet" href="css/contact.css">
</head>
<body>
    
    <div class="snowfall" aria-hidden="true"></div>

    <nav class="back-nav">
        <a class="back-btn" href="portfolio.html"><span class="arrow">&larr;</span> Back to Portfolio</a>
    </nav>

    <h1 id="top">Contact</h1>

    <form class="contact-form" action="#" method="post" onsubmit="return showContactInfo()">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Submit</button>
    </form>

    <script>
        function showContactInfo(){
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var subject = document.getElementById("subject").value;
            var message = document.getElementById("message").value;

            alert("Name: " + name + "\nEmail: " + email + "\nSubject: " + subject + "\nMessage: " + message);

            return false;
        }
    </script>
